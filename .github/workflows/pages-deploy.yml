# Official GitHub Pages deployment workflow for static HTML site
# Updated June 2025 for static site deployment
name: Deploy Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy-clean

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

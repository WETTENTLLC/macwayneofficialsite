<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mac Wayne Site Comprehensive Check</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: white; }
        .check-section { margin: 20px 0; padding: 15px; background: #333; border-radius: 5px; }
        .check-result { margin: 5px 0; padding: 5px; border-radius: 3px; }
        .pass { background: #28a745; }
        .fail { background: #dc3545; }
        .warning { background: #ffc107; color: #000; }
        .page-test { margin: 10px 0; padding: 10px; background: #444; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; margin: 5px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
    <h1>🔍 Mac Wayne Site Comprehensive Check</h1>
    
    <div class="check-section">
        <h2>📄 Page Accessibility Check</h2>
        <button id="check-pages-btn">Check All Pages</button>
        <div id="page-check-results" class="test-grid"></div>
    </div>
    
    <div class="check-section">
        <h2>🎵 Audio System Check</h2>
        <button id="check-audio-btn">Test Audio System</button>
        <div id="audio-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>💳 Payment System Check</h2>
        <button id="check-payment-btn">Test PayPal Integration</button>
        <div id="payment-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>📧 Email System Check</h2>
        <button id="check-email-btn">Test Email Notifications</button>
        <div id="email-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>🖼️ Image & Asset Check</h2>
        <button id="check-assets-btn">Check All Assets</button>
        <div id="asset-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>📱 Mobile Responsiveness</h2>
        <button id="check-responsive-btn">Test Mobile View</button>
        <div id="responsive-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>🔗 Link Validation</h2>
        <button id="check-links-btn">Validate All Links</button>
        <div id="link-check-results"></div>
    </div>
    
    <div class="check-section">
        <h2>📊 Overall Site Health</h2>
        <div id="overall-health">
            <div class="check-result warning">Run individual checks to see overall health</div>
        </div>
    </div>

    <script>
        const pages = [
            { name: 'Home', url: 'index.html', critical: true },
            { name: 'Shop', url: 'shop.html', critical: true },
            { name: 'Live', url: 'live.html', critical: false },
            { name: 'Battered Coin', url: 'battered-coin.html', critical: false },
            { name: 'Documentary', url: 'documentary.html', critical: false }
        ];
        
        let checkResults = {
            pages: 0,
            audio: 0,
            payment: 0,
            email: 0,
            assets: 0,
            responsive: 0,
            links: 0
        };
        
        async function checkAllPages() {
            const resultsDiv = document.getElementById('page-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Checking pages...</div>';
            
            let results = [];
            
            for (const page of pages) {
                try {
                    const response = await fetch(page.url, { method: 'HEAD' });
                    const status = response.ok ? 'PASS' : 'FAIL';
                    const statusCode = response.status;
                    
                    results.push(`
                        <div class="page-test">
                            <div class="check-result ${status.toLowerCase()}">
                                ${page.name}: ${status} (${statusCode})
                                ${page.critical ? ' [CRITICAL]' : ''}
                            </div>
                        </div>
                    `);
                } catch (error) {
                    results.push(`
                        <div class="page-test">
                            <div class="check-result fail">
                                ${page.name}: ERROR - ${error.message}
                            </div>
                        </div>
                    `);
                }
            }
            
            resultsDiv.innerHTML = results.join('');
            checkResults.pages = results.filter(r => r.includes('PASS')).length;
            updateOverallHealth();
        }
        
        async function checkAudioSystem() {
            const resultsDiv = document.getElementById('audio-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Testing audio system...</div>';
            
            const tests = [];
            
            // Test sample files
            const sampleTests = [];
            for (let i = 1; i <= 5; i++) { // Test first 5 samples
                const trackNum = i.toString().padStart(2, '0');
                try {
                    const response = await fetch(`samples/${trackNum}-sample.mp3`, { method: 'HEAD' });
                    const size = response.headers.get('content-length');
                    sampleTests.push({
                        track: i,
                        status: response.ok && size > 1000 ? 'PASS' : 'FAIL',
                        size: size ? `${Math.round(size / 1024 / 1024 * 100) / 100}MB` : 'Unknown'
                    });
                } catch (error) {
                    sampleTests.push({ track: i, status: 'FAIL', size: 'Error' });
                }
            }
            
            // Test audio player script (check if it exists on main site)
            let audioPlayerExists = false;
            try {
                const response = await fetch('js/fixed-audio-player.js', { method: 'HEAD' });
                audioPlayerExists = response.ok;
            } catch (error) {
                audioPlayerExists = false;
            }
            
            tests.push(`
                <div class="check-result ${audioPlayerExists ? 'pass' : 'fail'}">
                    Audio Player Script: ${audioPlayerExists ? 'LOADED' : 'MISSING'}
                </div>
            `);
            
            sampleTests.forEach(test => {
                tests.push(`
                    <div class="check-result ${test.status.toLowerCase()}">
                        Sample ${test.track}: ${test.status} (${test.size})
                    </div>
                `);
            });
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.audio = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        async function checkPaymentSystem() {
            const resultsDiv = document.getElementById('payment-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Testing payment system...</div>';
            
            const tests = [];
            
            // Check if PayPal script exists
            try {
                const response = await fetch('index.html');
                const html = await response.text();
                const hasPayPalScript = html.includes('paypal.com/sdk/js');
                
                tests.push(`
                    <div class="check-result ${hasPayPalScript ? 'pass' : 'fail'}">
                        PayPal SDK Integration: ${hasPayPalScript ? 'FOUND IN HTML' : 'MISSING'}
                    </div>
                `);
                
                const hasPurchaseButtons = html.includes('purchase-track') || html.includes('purchase-album');
                tests.push(`
                    <div class="check-result ${hasPurchaseButtons ? 'pass' : 'fail'}">
                        Purchase Buttons: ${hasPurchaseButtons ? 'FOUND IN HTML' : 'MISSING'}
                    </div>
                `);
                
                const hasAudioPlayer = html.includes('fixed-audio-player.js');
                tests.push(`
                    <div class="check-result ${hasAudioPlayer ? 'pass' : 'fail'}">
                        Audio Player Integration: ${hasAudioPlayer ? 'FOUND' : 'MISSING'}
                    </div>
                `);
                
            } catch (error) {
                tests.push(`
                    <div class="check-result fail">
                        Payment System Check: ERROR - ${error.message}
                    </div>
                `);
            }
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.payment = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        async function checkEmailSystem() {
            const resultsDiv = document.getElementById('email-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Testing email system...</div>';
            
            const tests = [];
            
            // Test Formspree endpoint
            try {
                const testData = new FormData();
                testData.append('_subject', 'Test Email - Mac Wayne Site Check');
                testData.append('message', 'This is a test email from the site checker.');
                testData.append('email', 'test@example.com');
                
                const response = await fetch('https://formspree.io/f/mldlyaln', {
                    method: 'POST',
                    body: testData,
                    headers: { 'Accept': 'application/json' }
                });
                
                tests.push(`
                    <div class="check-result ${response.ok ? 'pass' : 'fail'}">
                        Formspree Endpoint: ${response.ok ? 'WORKING' : 'FAILED'} (${response.status})
                    </div>
                `);
            } catch (error) {
                tests.push(`
                    <div class="check-result fail">
                        Formspree Endpoint: ERROR - ${error.message}
                    </div>
                `);
            }
            
            // Check newsletter forms
            const newsletterForms = document.querySelectorAll('#newsletter-form, #notify-form').length;
            tests.push(`
                <div class="check-result ${newsletterForms > 0 ? 'pass' : 'warning'}">
                    Newsletter Forms: ${newsletterForms} found
                </div>
            `);
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.email = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        async function checkAssets() {
            const resultsDiv = document.getElementById('asset-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Checking assets...</div>';
            
            const assets = [
                'images/macwayne-logo.png',
                'images/macwayne-background.png',
                'styles/main.css',
                'styles/components.css',
                'js/main.js',
                'js/fixed-audio-player.js'
            ];
            
            const tests = [];
            
            for (const asset of assets) {
                try {
                    const response = await fetch(asset, { method: 'HEAD' });
                    tests.push(`
                        <div class="check-result ${response.ok ? 'pass' : 'fail'}">
                            ${asset}: ${response.ok ? 'OK' : 'MISSING'} (${response.status})
                        </div>
                    `);
                } catch (error) {
                    tests.push(`
                        <div class="check-result fail">
                            ${asset}: ERROR
                        </div>
                    `);
                }
            }
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.assets = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        async function checkResponsiveness() {
            const resultsDiv = document.getElementById('responsive-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Testing mobile responsiveness...</div>';
            
            const tests = [];
            
            try {
                const response = await fetch('index.html');
                const html = await response.text();
                
                // Check viewport meta tag
                const hasViewport = html.includes('name="viewport"');
                tests.push(`
                    <div class="check-result ${hasViewport ? 'pass' : 'fail'}">
                        Viewport Meta Tag: ${hasViewport ? 'PRESENT' : 'MISSING'}
                    </div>
                `);
                
                // Check mobile menu
                const hasMobileMenu = html.includes('mobile-menu-toggle');
                tests.push(`
                    <div class="check-result ${hasMobileMenu ? 'pass' : 'warning'}">
                        Mobile Menu: ${hasMobileMenu ? 'PRESENT' : 'MISSING'}
                    </div>
                `);
                
                // Check responsive CSS
                const hasResponsiveCSS = html.includes('main.css');
                tests.push(`
                    <div class="check-result ${hasResponsiveCSS ? 'pass' : 'warning'}">
                        Responsive CSS: ${hasResponsiveCSS ? 'LOADED' : 'MISSING'}
                    </div>
                `);
                
            } catch (error) {
                tests.push(`
                    <div class="check-result fail">
                        Responsiveness Check: ERROR - ${error.message}
                    </div>
                `);
            }
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.responsive = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        async function checkLinks() {
            const resultsDiv = document.getElementById('link-check-results');
            resultsDiv.innerHTML = '<div class="check-result warning">Checking links...</div>';
            
            const links = Array.from(document.querySelectorAll('a[href]')).slice(0, 10); // Test first 10 links
            const tests = [];
            
            for (const link of links) {
                const href = link.getAttribute('href');
                if (href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) {
                    tests.push(`
                        <div class="check-result pass">
                            ${href}: ANCHOR/SPECIAL LINK
                        </div>
                    `);
                    continue;
                }
                
                try {
                    if (href.startsWith('http')) {
                        tests.push(`
                            <div class="check-result warning">
                                ${href}: EXTERNAL LINK (not tested)
                            </div>
                        `);
                    } else {
                        const response = await fetch(href, { method: 'HEAD' });
                        tests.push(`
                            <div class="check-result ${response.ok ? 'pass' : 'fail'}">
                                ${href}: ${response.ok ? 'OK' : 'BROKEN'} (${response.status})
                            </div>
                        `);
                    }
                } catch (error) {
                    tests.push(`
                        <div class="check-result fail">
                            ${href}: ERROR
                        </div>
                    `);
                }
            }
            
            resultsDiv.innerHTML = tests.join('');
            checkResults.links = tests.filter(t => t.includes('pass')).length;
            updateOverallHealth();
        }
        
        function updateOverallHealth() {
            const total = Object.values(checkResults).reduce((a, b) => a + b, 0);
            const maxPossible = Object.keys(checkResults).length * 3; // Rough estimate
            const percentage = Math.round((total / maxPossible) * 100);
            
            let healthStatus = 'fail';
            let healthText = 'Poor';
            
            if (percentage >= 80) {
                healthStatus = 'pass';
                healthText = 'Excellent';
            } else if (percentage >= 60) {
                healthStatus = 'warning';
                healthText = 'Good';
            }
            
            document.getElementById('overall-health').innerHTML = `
                <div class="check-result ${healthStatus}">
                    Overall Site Health: ${healthText} (${percentage}%)
                </div>
                <div class="check-result">
                    Pages: ${checkResults.pages} | Audio: ${checkResults.audio} | 
                    Payment: ${checkResults.payment} | Email: ${checkResults.email} |
                    Assets: ${checkResults.assets} | Mobile: ${checkResults.responsive} |
                    Links: ${checkResults.links}
                </div>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('check-pages-btn').addEventListener('click', checkAllPages);
            document.getElementById('check-audio-btn').addEventListener('click', checkAudioSystem);
            document.getElementById('check-payment-btn').addEventListener('click', checkPaymentSystem);
            document.getElementById('check-email-btn').addEventListener('click', checkEmailSystem);
            document.getElementById('check-assets-btn').addEventListener('click', checkAssets);
            document.getElementById('check-responsive-btn').addEventListener('click', checkResponsiveness);
            document.getElementById('check-links-btn').addEventListener('click', checkLinks);
            console.log('Site comprehensive checker loaded and listeners attached.');
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Server Communication</title>
</head>
<body>
    <h1>Test Server Communication</h1>
    <button onclick="testServer()">Test Server Connection</button>
    <div id="result"></div>

    <script>
        async function testServer() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing server connection...';
            
            try {
                const response = await fetch('http://localhost:3000/webhook/paypal', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        itemType: 'track',
                        itemId: 'test-track.mp3',
                        itemName: 'Test Track',
                        amount: '5.00',
                        currency: 'USD',
                        userId: 'test-user-123',
                        userEmail: 'macwayneofficial@gmail.com',
                        orderId: 'test-order-123',
                        timestamp: new Date().toISOString()
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = '<p style="color: green;">✅ Server communication successful!</p><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    result.innerHTML = '<p style="color: red;">❌ Server responded with error: ' + response.status + '</p>';
                }
            } catch (error) {
                result.innerHTML = '<p style="color: red;">❌ Error connecting to server: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
